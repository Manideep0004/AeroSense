version: '3.8'

services:
  # Main Inference API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aarosense_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount required stateful directories
      - ./models:/app/models:ro
      - ./baselines:/app/baselines:ro
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - ./mlruns:/app/mlruns
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlruns/mlflow.db
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Local MLflow Tracking UI
  mlflow-ui:
    image: ghcr.io/mlflow/mlflow:v2.20.1
    container_name: aarosense_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./models:/models
    command: >
      mlflow ui 
      --backend-store-uri sqlite:////mlruns/mlflow.db 
      --default-artifact-root /mlruns
      --host 0.0.0.0
